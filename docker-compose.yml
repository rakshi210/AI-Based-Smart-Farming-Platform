version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smart_farming_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=${MONGODB_URI}
      - JWT_SECRET=${JWT_SECRET}
    env_file:
      - ./backend/.env
    networks:
      - farming_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smart_farming_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - farming_network

networks:
  farming_network:
    driver: bridge

